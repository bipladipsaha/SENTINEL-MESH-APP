name: sentinel_mesh
description: Decentralized Safety Network
version: 1.3.0+1
publish_to: 'none'

environment:
  sdk: '^3.11.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^14.0.0

  # Firebase
  firebase_core: ^2.30.0
  firebase_database: ^10.5.0
  firebase_auth: ^4.19.0
  firebase_messaging: ^14.9.0
  
  # Location & Permissions
  geolocator: ^11.0.0
  permission_handler: ^11.3.0
  
  # Notifications & Camera
  flutter_local_notifications: ^17.1.0
  camera: ^0.10.5
  
  # AI & ML
  google_generative_ai: ^0.4.7
  google_mlkit_pose_detection: ^0.11.0
  flutter_dotenv: ^5.1.0
  
  # Essential packages
  google_maps_flutter: ^2.14.2
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  google_fonts: ^6.2.1
  http: ^1.2.0
  android_intent_plus: ^6.0.0
  dio: ^5.11.0

  # Animations
  flutter_animate: ^4.5.0
  animated_text_kit: ^4.2.3
  lottie: ^3.1.0

  # UI Utilities
  shimmer: ^3.0.0
  cached_network_image: ^3.4.0

  # BLE (ESP32 device connection)
  flutter_blue_plus: ^1.32.0

  # Sensors (fall detection)
  sensors_plus: ^5.0.0
  tflite_flutter: ^0.12.1
  record: ^6.0.0
  sqflite: ^2.4.2+1
  path_provider: ^2.1.5
  sqlite3: ^2.4.5
  mapbox_maps_flutter: ^2.27.0
  latlong2: ^0.10.1
  flutter_background_service: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/models/
    - assets/maps/
