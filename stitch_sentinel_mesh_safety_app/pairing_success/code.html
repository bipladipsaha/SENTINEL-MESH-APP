<style>
      body {
        background-color: #F7F8FA;
        overflow: hidden;
      }
      .success-pulse {
        animation: pulse-glow 2s infinite ease-in-out;
      }
      @keyframes pulse-glow {
        0% { box-shadow: 0 0 0 0 rgba(0, 107, 93, 0.4); }
        70% { box-shadow: 0 0 0 20px rgba(0, 107, 93, 0); }
        100% { box-shadow: 0 0 0 0 rgba(0, 107, 93, 0); }
      }
      .float-animation {
        animation: float 4s ease-in-out infinite;
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 48;
      }

<body class="flex flex-col min-h-screen items-center justify-center font-body-md text-on-surface p-gutter">
<!-- Top Navigation Placeholder (Hidden for Transactional Success Screen per Shell Visibility Rule) -->
<main class="relative w-full max-w-md flex flex-col items-center">
<!-- Background Atmospheric Element -->
<div class="absolute -z-10 w-64 h-64 bg-secondary-container opacity-20 blur-3xl rounded-full"></div>
<!-- Success Card -->
<div class="w-full bg-surface-container-lowest rounded-3xl p-stack-lg shadow-[0_10px_30px_rgba(0,0,0,0.04)] flex flex-col items-center text-center">
<!-- Icon/Visual Section -->
<div class="relative mb-stack-lg">
<!-- Outer Ring -->
<div class="w-24 h-24 rounded-full border-4 border-secondary-fixed-dim flex items-center justify-center success-pulse bg-white">
<span class="material-symbols-outlined text-[48px] text-secondary" style="font-variation-settings: 'FILL' 1;">
                        check_circle
                    </span>
</div>
<!-- Particle Accents -->
<div class="absolute -top-2 -right-2 bg-secondary-container w-4 h-4 rounded-full animate-bounce"></div>
<div class="absolute bottom-0 -left-4 bg-primary-fixed w-3 h-3 rounded-full animate-pulse"></div>
</div>
<!-- Content Section -->
<div class="space-y-unit mb-stack-lg">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">
                    Device Connected
                </h1>
<p class="font-body-md text-on-surface-variant max-w-[280px] mx-auto">
                    Your mesh node is now synchronized and actively monitoring the local network.
                </p>
</div>
<!-- Device Identity Tag -->
<div class="w-full bg-surface-container-low rounded-xl p-stack-md flex items-center justify-between mb-stack-lg border border-outline-variant/30">
<div class="flex items-center gap-3">
<div class="w-10 h-10 bg-white rounded-lg flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-primary">
                            settings_input_antenna
                        </span>
</div>
<div class="text-left">
<div class="font-label-md text-label-md text-on-surface">Sentinel Device</div>
<div class="font-label-sm text-label-sm text-outline">ID: SM-00125</div>
</div>
</div>
<div class="flex items-center gap-2">
<div class="w-2 h-2 rounded-full bg-secondary animate-pulse"></div>
<span class="font-label-sm text-label-sm text-secondary">Active</span>
</div>
</div>
<!-- Action Button -->
<button class="w-full h-14 bg-primary text-on-primary rounded-xl font-headline-md text-headline-md hover:opacity-90 active:scale-95 transition-all shadow-md flex items-center justify-center gap-2" onclick="handleContinue()">
                Continue
                <span class="material-symbols-outlined">
                    arrow_forward
                </span>
</button>
</div>
<!-- Footer / Technical Info -->
<div class="mt-stack-lg flex flex-col items-center gap-2">
<div class="flex items-center gap-2 text-on-surface-variant opacity-60">
<span class="material-symbols-outlined text-sm">encrypted</span>
<span class="font-label-sm text-label-sm">Secured via Mesh Protocol 4.0</span>
</div>
</div>
</main>
<!-- Contextual Decorative Elements -->
<div class="fixed top-12 left-12 opacity-10 float-animation">
<div class="w-32 h-32 border-[16px] border-secondary-container rounded-full"></div>
</div>
<div class="fixed bottom-12 right-12 opacity-10 float-animation" style="animation-delay: 2s;">
<div class="w-24 h-24 border-[12px] border-primary-fixed rounded-full"></div>
</div>
<script>
        function handleContinue() {
            // Visual feedback for interaction
            const btn = document.querySelector('button');
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> Loading Home...';
            
            // Artificial delay to simulate transition to Home screen
            setTimeout(() => {
                alert('Navigating to Home Screen...');
            }, 800);
        }

        // Simple entrance animation
        window.addEventListener('DOMContentLoaded', () => {
            const card = document.querySelector('.max-w-md');
            card.style.opacity = '0';
            card.style.transform = 'translateY(20px)';
            card.style.transition = 'all 0.6s cubic-bezier(0.16, 1, 0.3, 1)';
            
            setTimeout(() => {
                card.style.opacity = '1';
                card.style.transform = 'translateY(0)';
            }, 100);
        });
    </script>
