<body class="bg-background text-on-surface font-body-md min-h-screen flex flex-col">
<!-- Shell Visibility: TopAppBar (Sub-page: Back action implies temporary departure, but header is helpful for identity) -->
<header class="sticky top-0 z-50 bg-surface dark:bg-surface-dim flex items-center justify-between px-gutter py-stack-md w-full">
<div class="flex items-center gap-4">
<button aria-label="Back" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary font-bold">TravelRakshak</h1>
</div>
<div class="w-10 h-10 rounded-full bg-surface-container-high overflow-hidden border-2 border-primary-fixed">
<img class="w-full h-full object-cover" data-alt="A professional close-up portrait of a user for their medical profile. The lighting is soft and natural, typical of a health-tech application. The background is a clean, neutral gradient of light blue and white, reflecting the TravelRakshak brand identity and human-centric design." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBeWCV6OGR01MNdhRsxWzxJnRFYTk9T4Bqw7lb2JxgpkbkNyPhg-1X4_heezCiOvjDzi-pE-hy7ros3VGFDwfeG3sv4VX8Yeke49fgFTr742R89urhcVJ7kHwlTqytGMtebEQ9gFgXRUIaYsvJWCXoLjgK5pARbuwerIklJR6cuo0oXrIaynMc0Su5qoPVEkx0ObeWDFh7UJ--Z182IXZVdSQKFeRMT-as7GqUhHPJz0JPN_RtUvDM"/>
</div>
</header>
<main class="flex-grow flex flex-col px-gutter max-w-lg mx-auto w-full pb-32">
<!-- Progress Indicator -->
<div class="mt-stack-lg flex items-center gap-2 mb-stack-md">
<div class="h-2 flex-grow bg-primary rounded-full"></div>
<div class="h-2 flex-grow bg-surface-container-highest rounded-full"></div>
<div class="h-2 flex-grow bg-surface-container-highest rounded-full"></div>
</div>
<!-- Hero Illustration Section -->
<section class="mt-stack-md text-center">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface mb-stack-sm">Connect Your Device</h2>
<p class="font-body-md text-on-surface-variant mb-stack-lg">To begin your protection journey, pair your Sentinel wearable with the mesh network.</p>
<div class="relative w-full aspect-square max-w-[280px] mx-auto mb-stack-lg">
<!-- Soft Glow Background for Illustration -->
<div class="absolute inset-0 bg-primary/5 rounded-full blur-3xl pulse-animation"></div>
<img class="relative z-10 w-full h-full object-contain" data-alt="A soft, humanistic 3D illustration of a sleek, minimalist medical wearable device. The device has rounded edges and a comfortable fabric strap, styled in a palette of soft whites and calm primary blues. It is floating gracefully against a clean, breathable background with subtle ambient shadows, conveying safety and medical reliability." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDW27wXLyTZdi_9ylkfWEgFETwIYCLoiWQVJiWEJKFmAzaiYy5eAy58R6eyfNb4jmLGrs3HH_hxvEtEdvv8dbNs-95BRs13J3wKaGZ2WVBdYBYusPS0FrpAnVCV_TFRqCe6KSVm8mAIn-cmVEIid3-DG5Lv3wDm67BHjio6bWNEHQPGVuhVufwWONwz0VlpmjjD6ukVksSYxUoI3k2q5IlKoviuxtfmGW9oa07835sB7LVV3eDQk0M"/>
</div>
</section>
<!-- Selection Options (Asymmetric/Bento-lite) -->
<section class="grid grid-cols-1 gap-stack-md">
<!-- Option: Scan QR -->
<button class="group flex items-center p-stack-md bg-surface-container-lowest rounded-[24px] border-2 border-transparent hover:border-primary/20 active:scale-95 transition-all soft-glow-shadow text-left" id="btn-scan">
<div class="w-12 h-12 rounded-xl bg-surface-container flex items-center justify-center text-primary group-hover:bg-primary group-hover:text-on-primary transition-colors">
<span class="material-symbols-outlined text-[28px]">qr_code_scanner</span>
</div>
<div class="ml-stack-md flex-grow">
<p class="font-label-md text-label-md text-on-surface">Scan QR Code</p>
<p class="font-label-sm text-label-sm text-on-surface-variant">Found on the back of the device box</p>
</div>
<span class="material-symbols-outlined text-outline-variant">chevron_right</span>
</button>
<!-- Option: Manual Entry -->
<button class="group flex items-center p-stack-md bg-surface-container-lowest rounded-[24px] border-2 border-transparent hover:border-primary/20 active:scale-95 transition-all soft-glow-shadow text-left" id="btn-manual">
<div class="w-12 h-12 rounded-xl bg-surface-container flex items-center justify-center text-primary group-hover:bg-primary group-hover:text-on-primary transition-colors">
<span class="material-symbols-outlined text-[28px]">keyboard</span>
</div>
<div class="ml-stack-md flex-grow">
<p class="font-label-md text-label-md text-on-surface">Enter Device ID</p>
<p class="font-label-sm text-label-sm text-on-surface-variant">Type the 8-digit code manually</p>
</div>
<span class="material-symbols-outlined text-outline-variant">chevron_right</span>
</button>
</section>
<!-- Hidden Manual Input Field (Progressive Disclosure) -->
<div class="hidden mt-stack-md space-y-stack-sm" id="manual-input-area">
<label class="font-label-md text-label-md text-on-surface-variant px-1" for="device-id">8-Digit Device ID</label>
<input class="w-full h-14 bg-surface-container-low border-none rounded-xl px-4 text-headline-md font-bold text-primary focus:ring-2 focus:ring-primary placeholder:text-outline-variant placeholder:font-normal" id="device-id" placeholder="e.g. SN-8829-X" type="text"/>
</div>
<!-- Visual Hint -->
<div class="mt-stack-lg p-stack-md bg-surface-container-high/50 rounded-[20px] flex gap-stack-sm items-start">
<span class="material-symbols-outlined text-secondary text-[20px]">info</span>
<p class="font-label-sm text-label-sm text-on-surface-variant">Ensure your device is charged and nearby. The LED should be pulsing blue during setup.</p>
</div>
</main>
<!-- Fixed Bottom Action Bar -->
<footer class="fixed bottom-0 left-0 w-full bg-surface/80 backdrop-blur-md px-gutter py-stack-lg z-50">
<div class="max-w-lg mx-auto flex flex-col gap-stack-md">
<button class="w-full h-[56px] bg-primary text-on-primary font-headline-md text-headline-md rounded-[16px] shadow-lg active:scale-[0.98] transition-all flex items-center justify-center gap-2">
<span>Pair Device</span>
<span class="material-symbols-outlined">bluetooth_searching</span>
</button>
<button class="w-full text-center font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors">
        I don't have a device yet
      </button>
</div>
</footer>
<script>
    // Simple UI interaction for manual entry toggle
    const btnManual = document.getElementById('btn-manual');
    const manualArea = document.getElementById('manual-input-area');
    const btnScan = document.getElementById('btn-scan');

    btnManual.addEventListener('click', () => {
      manualArea.classList.remove('hidden');
      btnManual.classList.add('border-primary', 'active-glow');
      btnScan.classList.remove('border-primary', 'active-glow');
      document.getElementById('device-id').focus();
    });

    btnScan.addEventListener('click', () => {
      manualArea.classList.add('hidden');
      btnScan.classList.add('border-primary', 'active-glow');
      btnManual.classList.remove('border-primary', 'active-glow');
    });

    // Device ID Auto-formatting logic
    const input = document.getElementById('device-id');
    input.addEventListener('input', (e) => {
      let value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (value.length > 2 && value.length <= 6) {
        value = value.slice(0, 2) + '-' + value.slice(2);
      } else if (value.length > 6) {
        value = value.slice(0, 2) + '-' + value.slice(2, 6) + '-' + value.slice(6, 7);
      }
      e.target.value = value.slice(0, 9);
    });
  </script>
</body></html>
