<!-- Visual Atmosphere: Subtle Noise or Glow -->
<div class="fixed inset-0 pointer-events-none z-[-1] opacity-20">

</div>
<script>
        // Micro-interaction for the Navigate button
        const navBtn = document.querySelector('button.bg-primary');
        navBtn.addEventListener('click', () => {
            // Haptic feedback simulation
            if (window.navigator.vibrate) {
                window.navigator.vibrate(20);
            }
            // Visual feedback
            navBtn.classList.add('bg-on-primary-fixed-variant');
            setTimeout(() => {
                navBtn.classList.remove('bg-on-primary-fixed-variant');
            }, 150);
        });

        // Dynamic ETA updater (mock)
        let eta = 4;
        const etaElement = document.querySelector('.text-tertiary.font-extrabold');
        setInterval(() => {
            if (Math.random() > 0.8 && eta > 1) {
                eta -= 1;
                etaElement.innerText = eta;
                etaElement.parentElement.classList.add('scale-110');
                setTimeout(() => etaElement.parentElement.classList.remove('scale-110'), 300);
            }
        }, 15000);
    </script>
