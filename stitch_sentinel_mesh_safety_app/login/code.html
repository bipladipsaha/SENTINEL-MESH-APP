<style>
      body {
        background-color: #F7F8FA;
        font-family: 'Manrope', sans-serif;
        color: #121c2c;
      }
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .card-shadow {
        box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.04);
      }
      .btn-hover:active {
        transform: scale(0.98);
      }
      .input-focus:focus-within {
        border-color: #2f6bff;

<body class="min-h-screen flex items-center justify-center p-gutter">
<!-- Login Container -->
<div class="w-full max-w-[480px] flex flex-col gap-stack-lg">
<!-- Brand Header (Suppressed Nav Shell as per Transactional Rule) -->
<div class="flex flex-col items-center text-center gap-stack-sm">
<div class="flex items-center gap-2 mb-2">
<span class="material-symbols-outlined text-primary text-4xl" style="font-variation-settings: 'FILL' 1;">shield_with_heart</span>
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight">Sentinel Mesh</h1>
</div>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[320px]">
                Securing your world with human-centric protection and radical clarity.
            </p>
</div>
<!-- Illustration Card -->
<div class="w-full bg-white rounded-xl card-shadow overflow-hidden p-6 flex flex-col items-center gap-stack-md border border-surface-container">
<div class="w-full aspect-[16/9] rounded-lg overflow-hidden bg-surface-container-low relative">
<img class="w-full h-full object-cover opacity-90" data-alt="A high-quality 3D minimalist illustration of a soft, glowing blue protective mesh gently cradling a family home. The scene is set in a calm, ethereal environment with soft, diffused morning light. The color palette consists of soft off-whites, Primary Blue gradients, and subtle mint green accents. The style is clean, modern, and corporate, evoking a sense of psychological safety and medical-grade reliability." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCKLPLDIL9HOOL1rqXyKvoyvZzdqgxNf-lmOtN7Cs4tp3wyWaMZW7kRiq9GFru2Yqf43rXus77Z2i37U99EHFIptmtEfo3cb8NICKGkcOiyNZ9b8v6sd3OWjT3C5vZnmTgMuHprjn628OVliU67K8htKDnOV9XVLHF6k1Q-Lnist-ym6nNCayIH1pbMt_rxKT4orODl8o-U7xC5PXwhhPrLTAhMqIm_-BtkvPPuiL0r8dpwDty0VQY"/>
<!-- Atmospheric Overlay -->
<div class="absolute inset-0 bg-gradient-to-t from-white/20 to-transparent"></div>
</div>
<div class="text-center">
<h2 class="font-headline-md text-headline-md text-on-surface">Welcome Back</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Please enter your details to continue.</p>
</div>
</div>
<!-- Form Section -->
<form class="flex flex-col gap-stack-md" onsubmit="return false;">
<!-- Email Field -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface-variant px-1" for="email">Email Address</label>
<div class="relative group">
<div class="absolute inset-y-0 left-4 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]">mail</span>
</div>
<input class="w-full h-[56px] pl-12 pr-4 bg-[#EDF2F7] border-2 border-transparent rounded-lg font-body-md text-body-md outline-none transition-all input-focus" id="email" placeholder="name@company.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-1.5">
<div class="flex justify-between items-center px-1">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:underline transition-all" href="#">Forgot Password?</a>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-4 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input class="w-full h-[56px] pl-12 pr-12 bg-[#EDF2F7] border-2 border-transparent rounded-lg font-body-md text-body-md outline-none transition-all input-focus" id="password" placeholder="••••••••" type="password"/>
<button class="absolute inset-y-0 right-4 flex items-center text-outline hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Primary Action -->
<button class="w-full h-[56px] bg-primary hover:bg-primary-container text-white font-label-md text-label-md rounded-lg shadow-md transition-all btn-hover mt-stack-sm flex items-center justify-center gap-2 group">
<span>Login</span>
<span class="material-symbols-outlined text-[20px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</form>
<!-- Footer / Secondary Action -->
<div class="text-center pt-2">
<p class="font-body-md text-body-md text-on-surface-variant">
                New to Sentinel Mesh? 
                <a class="text-primary font-label-md text-label-md ml-1 hover:underline" href="#">Create an account</a>
</p>
</div>
</div>
<!-- Micro-interaction Script -->
<script>
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', function(e) {
                if(this.innerText.includes('Login')) {
                    const originalContent = this.innerHTML;
                    this.innerHTML = `<span class="inline-block animate-spin rounded-full h-5 w-5 border-2 border-white border-t-transparent mr-2"></span> Logging in...`;
                    this.disabled = true;
                    
                    setTimeout(() => {
                        this.innerHTML = originalContent;
                        this.disabled = false;
                    }, 1500);
                }
            });
        });

        // Toggle Password Visibility
        const passInput = document.getElementById('password');
        const toggleBtn = passInput.nextElementSibling;
        toggleBtn.addEventListener('click', () => {
            const isPass = passInput.type === 'password';
            passInput.type = isPass ? 'text' : 'password';
            toggleBtn.querySelector('span').innerText = isPass ? 'visibility_off' : 'visibility';
        });
    </script>
</body></html>
